name: Build Linux Package & Arch Repo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GIT_CONFIG_PARAMETERS: "'advice.defaultBranchName=false' 'init.defaultBranch=main'"
  RUSTC_WRAPPER: sccache
  CARGO_BUILD_RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"
  RUST_LOG: "error"
  ZED_LOG: "error"
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"

jobs:
  # ========================================================
  # Quality Gate: Format, Clippy, Nextest & Audit
  # ========================================================
  test-and-lint:
    name: Lint, Clippy, Nextest & Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.11
        with:
          version: "v0.10.0"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install System Dependencies
        run: |
          ./script/linux

      - name: Install Rust Toolchain & Nextest
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
          targets: wasm32-wasip2, wasm32-unknown-unknown

      - name: Install nextest & audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-audit

      - name: Format Check
        run: |
          cargo fmt --all --check

      - name: Clippy Workspace
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Workspace (Nextest)
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: |
          cargo nextest run --workspace --all-features

      - name: Cargo Audit
        run: |
          cargo audit

  # ========================================================
  # Parallel Packaging: Build Release & Arch Repo
  # ========================================================
  package-linux:
    name: Build Release & Arch Repo
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.11
        with:
          version: "v0.10.0"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install System Dependencies
        run: |
          ./script/linux
          sudo apt-get install -y libarchive-tools zstd

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          targets: wasm32-wasip2, wasm32-unknown-unknown

      - name: Update Pacman Repo
        env:
          CC: clang
          CXX: clang++
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./script/bundle-linux
          ./script/package-arch

      - name: Upload Linux Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-linux-x86_64
          path: target/release/zed-linux-x86_64.tar.gz
          if-no-files-found: warn

      - name: Upload Arch Linux Repository Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zed-arch-repo
          path: target/release/arch-repo/*
          if-no-files-found: warn

      - name: Publish Pacman Repository to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view repo >/dev/null 2>&1; then
            gh release upload repo target/release/arch-repo/* --clobber
          else
            gh release create repo target/release/arch-repo/* \
              --title "Custom Zed Arch Linux Repository" \
              --notes "Automated Pacman repository for custom minimal Zed on Arch Linux. Add this repository to /etc/pacman.conf to receive automated updates on 'pacman -Syu'."
          fi
