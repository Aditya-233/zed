name: Build Linux Package (No Titlebar)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GIT_CONFIG_PARAMETERS: "'advice.defaultBranchName=false' 'init.defaultBranch=main'"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  build-linux-x86_64:
    name: Build Linux x86_64 (No Titlebar)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.9
        with:
          version: "v0.10.0"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}


      - name: Install System Dependencies
        run: |
          ./script/linux

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          targets: wasm32-wasip2, wasm32-unknown-unknown

      - name: Build Zed Release Package
        env:
          CC: clang
          CXX: clang++
        run: |
          ./script/bundle-linux

      - name: Build Arch Linux Pacman Package & Repository
        run: |
          sudo apt-get install -y libarchive-tools zstd
          ./script/package-arch

      - name: Upload Linux Tarball Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zed-linux-x86_64-no-titlebar
          path: target/release/zed-linux-x86_64.tar.gz
          if-no-files-found: warn

      - name: Upload Compilation Timings Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cargo-timing-report
          path: target/**/cargo-timings/*.html
          if-no-files-found: ignore

      - name: Upload Arch Linux Repository Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zed-arch-repo
          path: target/release/arch-repo/*
          if-no-files-found: warn

      - name: Publish Pacman Repository to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view repo >/dev/null 2>&1; then
            gh release upload repo target/release/arch-repo/* --clobber
          else
            gh release create repo target/release/arch-repo/* \
              --title "Custom Zed Arch Linux Repository" \
              --notes "Automated Pacman repository for custom minimal Zed on Arch Linux. Add this repository to /etc/pacman.conf to receive automated updates on 'pacman -Syu'."
          fi

