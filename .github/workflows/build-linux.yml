name: Build Linux Package & Arch Repo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GIT_CONFIG_PARAMETERS: "'advice.defaultBranchName=false' 'init.defaultBranch=main'"
  RUSTC_WRAPPER: sccache
  CARGO_BUILD_RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"

jobs:
  ci-build:
    name: Lint, Check, Test, Audit & Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.11
        with:
          version: "v0.10.0"

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install System Dependencies
        run: |
          ./script/linux

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
          targets: wasm32-wasip2, wasm32-unknown-unknown

      - name: Format Check
        run: |
          cargo fmt --all --check

      - name: Check Workspace
        run: |
          cargo check --workspace --all-targets --all-features

      - name: Clippy Workspace
        run: |
          cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test Workspace
        run: |
          cargo test --workspace --all-features

      - name: Cargo Audit
        run: |
          command -v cargo-audit || cargo install cargo-audit --locked
          cargo audit

      - name: Update Pacman Repo
        env:
          CC: clang
          CXX: clang++
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./script/bundle-linux
          sudo apt-get install -y libarchive-tools zstd
          ./script/package-arch

      - name: Upload Linux Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zed-linux-x86_64
          path: target/release/zed-linux-x86_64.tar.gz
          if-no-files-found: warn

      - name: Upload Arch Linux Repository Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zed-arch-repo
          path: target/release/arch-repo/*
          if-no-files-found: warn

      - name: Publish Pacman Repository to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view repo >/dev/null 2>&1; then
            gh release upload repo target/release/arch-repo/* --clobber
          else
            gh release create repo target/release/arch-repo/* \
              --title "Custom Zed Arch Linux Repository" \
              --notes "Automated Pacman repository for custom minimal Zed on Arch Linux. Add this repository to /etc/pacman.conf to receive automated updates on 'pacman -Syu'."
          fi
